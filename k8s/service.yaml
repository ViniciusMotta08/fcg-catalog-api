# Dentro do cluster o serviço é acessado por http://catalog-api:80
apiVersion: v1
kind: Service
metadata:
  name: catalog-api
  namespace: fcg
  labels:
    app.kubernetes.io/name: catalog-api
    app.kubernetes.io/part-of: fiap-cloud-games
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: catalog-api
  ports:
    - name: http
      port: 80
      targetPort: http
